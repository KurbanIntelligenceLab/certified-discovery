[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certdisc"
version = "1.0.0"
description = "Certified discovery: statistically valid materials screening claims from a small DFT verification budget"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Hasan Kurban" },
    { name = "Mustafa Kurban" },
]
keywords = [
    "prediction-powered inference",
    "materials discovery",
    "uncertainty quantification",
    "confidence intervals",
    "machine-learning interatomic potentials",
    "matbench-discovery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Reproducing the paper's figures, tables, and the full analysis notebook.
analysis = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "jupyter",
    "nbclient",
    "matbench-discovery>=1.3",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/hasankurban/certified-discovery"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
