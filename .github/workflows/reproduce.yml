name: reproduce

# Re-executes the independent pipeline from the public inputs and compares the outputs with
# the committed result files. Runs on request and monthly; the fifteen-model part fetches the
# frontier prediction files from figshare (reachable from GitHub-hosted runners).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

jobs:
  five-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pandas scipy
      - name: Fetch inputs (checksummed)
        run: bash experiments/fetch_data.sh
      - name: Re-run the experiments
        run: make experiments
      - name: Outputs must match the committed result files (numerically, rtol 1e-9)
        run: python scripts/compare_results.py experiments/results
      - name: Theory checks and verification
        run: |
          cd experiments/verification && python math_checks.py
          cd ../.. && python scripts/verify_results.py results experiments/results

  fifteen-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: five-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pandas scipy
      - name: Fetch inputs, including the frontier prediction files from figshare
        run: |
          bash experiments/fetch_data.sh
          bash experiments/fetch_frontier.sh
      - name: Re-execute the run of record for all fifteen models
        run: |
          cd experiments
          MODELS=all python exp5_reproduce_e1_e3.py | tee ../fifteen_model_summary.txt
          MODELS=all python exp4_shared_budget.py | tee -a ../fifteen_model_summary.txt
      - name: Require an exact match with the run of record
        run: |
          grep -q "E1 re-execution: 90/90" fifteen_model_summary.txt
          grep -q "E3 re-execution: 28/28" fifteen_model_summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifteen-model-results
          path: |
            experiments/results/*_15models.csv
            fifteen_model_summary.txt
