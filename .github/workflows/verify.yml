name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: reconcile results and run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pandas   # verify_results.py reads the CSVs with pandas

      - name: Reconcile the headline numbers and tables against the source data
        run: python scripts/verify_results.py results experiments/results

      - name: Static analysis
        run: |
          pip install pyflakes
          python -m pyflakes src/certdisc scripts experiments

      - name: Run unit and smoke tests
        run: pytest -q
